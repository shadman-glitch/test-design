<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Curved Cylindrical Portfolio Showcase — Framer Replica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Oswald:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
    }

    #webgl-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #webgl-container.dragging {
      cursor: grabbing;
    }

    #webgl-container.hovering-card {
      cursor: pointer;
    }

    /* Far-right custom thin scrollbar matching the reference video frame */
    .video-scrollbar {
      position: fixed;
      top: 0;
      right: 0;
      width: 6px;
      height: 100vh;
      background: #070707;
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 40;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }

    .scroll-arrow {
      width: 4px;
      height: 4px;
      opacity: 0.45;
      fill: #888;
    }

    .scroll-track {
      position: relative;
      flex: 1;
      width: 100%;
      margin: 2px 0;
    }

    .scroll-thumb {
      position: absolute;
      left: 1px;
      right: 1px;
      height: 30px;
      background: rgba(215, 215, 222, 0.78);
      border-radius: 3px;
      top: 4px;
      transition: top 0.08s linear;
    }

    /* Compact Bottom-Center PHOTO | VIDEO Segmented Toggle Pill (height: 30px, bottom: 16px) */
    .mode-toggle-wrapper {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      height: 30px;
      display: flex;
      align-items: center;
      padding: 3px;
      border-radius: 999px;
      background: rgba(210, 215, 226, 0.22);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }

    .mode-pill-slider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
    }

    .mode-toggle-wrapper[data-mode="video"] .mode-pill-slider {
      transform: translateX(100%);
    }

    .mode-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      height: 24px;
      padding: 0 15px;
      min-width: 58px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease;
    }

    .mode-btn.active {
      color: #09090b;
    }

    .mode-btn.inactive {
      color: rgba(255, 255, 255, 0.88);
    }

    /* Compact Bottom-Left Gear Button (24px x 24px, bottom: 16px, left: 16px) */
    .settings-btn {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 30;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(20, 20, 24, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .settings-btn:hover {
      color: rgba(255, 255, 255, 0.95);
      background: rgba(38, 38, 46, 0.85);
      transform: rotate(30deg);
    }

    /* Compact Bottom-Right Made in Framer Badge (height: 24px, font-size: 10.5px, bottom: 16px, right: 16px) */
    .framer-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 30;
      height: 24px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      color: #000000;
      padding: 0 9px;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .framer-badge:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(255, 255, 255, 0.15);
    }

    /* Settings Popover Panel */
    .tuner-panel {
      position: fixed;
      bottom: 48px;
      left: 16px;
      z-index: 35;
      width: 256px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(12, 13, 17, 0.92);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.85);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.97);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tuner-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .tuner-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      outline: none;
    }

    .tuner-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 3D WebGL Viewport -->
  <div id="webgl-container"></div>

  <!-- Custom Far-Right Thin Scrollbar (Matches Video Frame) -->
  <div class="video-scrollbar" aria-hidden="true">
    <svg class="scroll-arrow" viewBox="0 0 8 8"><path d="M4 1L7 6H1L4 1Z"/></svg>
    <div class="scroll-track">
      <div id="scroll-thumb" class="scroll-thumb"></div>
    </div>
    <svg class="scroll-arrow" viewBox="0 0 8 8"><path d="M4 7L1 2H7L4 7Z"/></svg>
  </div>

  <!-- Compact Bottom-Center PHOTO | VIDEO Segmented Toggle Pill -->
  <div id="mode-toggle" class="mode-toggle-wrapper" data-mode="photo" role="group" aria-label="Display Mode">
    <div class="mode-pill-slider"></div>
    <button id="btn-photo" class="mode-btn active" type="button">PHOTO</button>
    <button id="btn-video" class="mode-btn inactive" type="button">VIDEO</button>
  </div>

  <!-- Compact Bottom-Left Settings Button -->
  <button id="settings-trigger" class="settings-btn" type="button" title="Scale & Timeline Controls">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- Floating Scene Tuner Panel (Toggled by Gear Icon) -->
  <div id="tuner-panel" class="tuner-panel">
    <div class="flex items-center justify-between mb-2.5">
      <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-300">Scene & Scale Tuner</span>
      <button id="reset-scene-btn" class="text-[10.5px] text-emerald-400 hover:text-emerald-300 font-medium">Reset 00:00</button>
    </div>

    <div class="space-y-2.5 text-[11px]">
      <div>
        <div class="flex justify-between text-zinc-400 mb-1">
          <span>Jump to Video Timestamp</span>
        </div>
        <div class="grid grid-cols-4 gap-1">
          <button data-time="0" class="ts-btn bg-white/10 hover:bg-white/20 rounded py-1 text-[10px] font-medium">00:00</button>
          <button data-time="2" class="ts-btn bg-white/10 hover:bg-white/20 rounded py-1 text-[10px] font-medium">00:02</button>
          <button data-time="4" class="ts-btn bg-white/10 hover:bg-white/20 rounded py-1 text-[10px] font-medium">00:04</button>
          <button data-time="6" class="ts-btn bg-white/10 hover:bg-white/20 rounded py-1 text-[10px] font-medium">00:06</button>
        </div>
      </div>

      <div>
        <div class="flex justify-between text-zinc-400 mb-1">
          <span>Viewport Scale</span>
          <span id="val-scale">100%</span>
        </div>
        <input id="slider-scale" type="range" min="0.65" max="1.30" step="0.01" value="1.00" class="tuner-slider" />
      </div>

      <div>
        <div class="flex justify-between text-zinc-400 mb-1">
          <span>Auto-Orbit Speed</span>
          <span id="val-speed">1.0x</span>
        </div>
        <input id="slider-speed" type="range" min="0" max="2.5" step="0.05" value="1.0" class="tuner-slider" />
      </div>

      <div>
        <div class="flex justify-between text-zinc-400 mb-1">
          <span>Diagonal Tilt Angle</span>
          <span id="val-tilt">-10.8°</span>
        </div>
        <input id="slider-tilt" type="range" min="-22" max="5" step="0.2" value="-10.8" class="tuner-slider" />
      </div>

      <div>
        <div class="flex justify-between text-zinc-400 mb-1">
          <span>Chromatic Dispersion</span>
          <span id="val-chroma">100%</span>
        </div>
        <input id="slider-chroma" type="range" min="0" max="2" step="0.05" value="1.0" class="tuner-slider" />
      </div>
    </div>
  </div>

  <!-- Compact Bottom-Right Made in Framer Badge -->
  <a href="#framer" onclick="event.preventDefault();" class="framer-badge">
    <svg width="9" height="13" viewBox="0 0 14 21" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0H14V7H7L0 0ZM0 7H7L14 14H7V21L0 14V7Z" fill="#000000"/>
    </svg>
    <span>Made in Framer</span>
  </a>

  <script>
    // ============================================================================
    // 1. HIGH-DPI PROCEDURAL CANVAS TEXTURE GENERATORS (2048 x 1220 — 1.68:1)
    //    Replicates all 8 cards in the reference video with razor-sharp typography,
    //    lighting, embedded thumbnails, and live VIDEO mode animations.
    // ============================================================================

    const CARD_TEX_W = 2048;
    const CARD_TEX_H = 1220;

    // Helper: Draw rounded rectangle path
    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    // ----------------------------------------------------------------------------
    // CARD 0: White Categories List Card
    // ("Entrepreneurship / Physical Health / Mindset / Trading" + 01 02 03 04)
    // ----------------------------------------------------------------------------
    function renderCategoriesCard(ctx, time, isVideoMode) {
      const w = CARD_TEX_W;
      const h = CARD_TEX_H;

      // Clean studio off-white surface (#F5F5F7)
      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, '#F7F7F9');
      bgGrad.addColorStop(0.5, '#F3F3F6');
      bgGrad.addColorStop(1, '#EEEEF2');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      const marginX = 96;
      const rowH = (h - 70) / 4;
      const startY = 35;

      // 3 Horizontal divider lines
      ctx.strokeStyle = '#DFDFE4';
      ctx.lineWidth = 2.5;
      for (let i = 1; i <= 3; i++) {
        const y = startY + i * rowH;
        ctx.beginPath();
        ctx.moveTo(marginX, y);
        ctx.lineTo(w - marginX, y);
        ctx.stroke();
      }

      const rows = [
        { num: '01', type: 'entrepreneurship' },
        { num: '02', type: 'physical_health' },
        { num: '03', type: 'mindset' },
        { num: '04', type: 'trading' }
      ];

      rows.forEach((row, idx) => {
        const centerY = startY + idx * rowH + rowH * 0.52;

        // Subtle video mode active row wave
        const rowWave = isVideoMode ? Math.sin(time * 2.6 - idx * 0.9) * 8 : 0;

        // Left small hollow/grey bullet circle
        ctx.save();
        ctx.strokeStyle = '#A8A8B2';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(marginX + 18, centerY, 7.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Far right hollow outline index number (01, 02, 03, 04) matching reference video
        ctx.save();
        ctx.font = '300 104px "Inter", sans-serif';
        ctx.strokeStyle = '#D5D5DC';
        ctx.lineWidth = 2.2;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.strokeText(row.num, w - marginX - 6, centerY + 4);
        ctx.restore();

        // Center Typography + Inline Rounded Thumbnail Pill
        ctx.save();
        ctx.font = '400 112px "Inter", sans-serif';
        ctx.fillStyle = '#121214';
        ctx.textBaseline = 'middle';

        const pillW = 144;
        const pillH = 92;
        const pillRadius = 18;
        const gap = 26;

        if (row.type === 'entrepreneurship') {
          const text = 'Entrepreneurship';
          const textW = ctx.measureText(text).width;
          const totalW = textW + gap + pillW;
          const startX = (w - totalW) * 0.5 - 20 + rowWave;

          ctx.fillText(text, startX, centerY);
          drawInlineThumbnail(ctx, startX + textW + gap, centerY - pillH * 0.52, pillW, pillH, pillRadius, 'entrepreneur', time, isVideoMode);
        } else if (row.type === 'physical_health') {
          const text1 = 'Physical';
          const text2 = 'Health';
          const w1 = ctx.measureText(text1).width;
          const w2 = ctx.measureText(text2).width;
          const totalW = w1 + gap + pillW + gap + w2;
          const startX = (w - totalW) * 0.5 - 20 - rowWave;

          ctx.fillText(text1, startX, centerY);
          drawInlineThumbnail(ctx, startX + w1 + gap, centerY - pillH * 0.52, pillW, pillH, pillRadius, 'gym', time, isVideoMode);
          ctx.fillText(text2, startX + w1 + gap + pillW + gap, centerY);
        } else if (row.type === 'mindset') {
          const text = 'Mindset';
          const textW = ctx.measureText(text).width;
          const totalW = pillW + gap + textW;
          const startX = (w - totalW) * 0.5 - 20 + rowWave;

          drawInlineThumbnail(ctx, startX, centerY - pillH * 0.52, pillW, pillH, pillRadius, 'mindset', time, isVideoMode);
          ctx.fillText(text, startX + pillW + gap, centerY);
        } else if (row.type === 'trading') {
          const text = 'Trading';
          const textW = ctx.measureText(text).width;
          const totalW = textW + gap + pillW;
          const startX = (w - totalW) * 0.5 - 20 - rowWave;

          ctx.fillText(text, startX, centerY);
          drawInlineThumbnail(ctx, startX + textW + gap, centerY - pillH * 0.52, pillW, pillH, pillRadius, 'trading', time, isVideoMode);
        }

        ctx.restore();
      });
    }

    // Helper for the 4 inline rounded thumbnail pills on the White Categories Card
    function drawInlineThumbnail(ctx, x, y, w, h, r, style, time, isVideoMode) {
      ctx.save();
      roundRectPath(ctx, x, y, w, h, r);
      ctx.clip();

      // Base dark background
      ctx.fillStyle = '#141210';
      ctx.fillRect(x, y, w, h);

      const pulse = isVideoMode ? Math.sin(time * 4.0) * 6 : 0;

      if (style === 'entrepreneur') {
        // Warm moody golden-brown portrait silhouette
        const g = ctx.createRadialGradient(x + w * 0.65 + pulse, y + h * 0.35, 4, x + w * 0.5, y + h * 0.5, w * 0.8);
        g.addColorStop(0, '#E89B54');
        g.addColorStop(0.45, '#6E3B18');
        g.addColorStop(1, '#120C08');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        // Head & shoulders silhouette
        ctx.fillStyle = '#22150D';
        ctx.beginPath();
        ctx.arc(x + w * 0.46, y + h * 0.38, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + w * 0.46, y + h * 0.92, 38, 32, 0, Math.PI, 0);
        ctx.fill();

        // Warm rim light on face
        ctx.strokeStyle = '#F7B977';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x + w * 0.48, y + h * 0.38, 19, -0.8, 0.9);
        ctx.stroke();
      } else if (style === 'gym') {
        // Dark gym scene with warm dust & battle ropes
        const g = ctx.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, '#2B211B');
        g.addColorStop(0.5, '#5E4231');
        g.addColorStop(1, '#14100E');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        // Athlete silhouette on left
        ctx.fillStyle = '#D99B72';
        ctx.beginPath();
        ctx.arc(x + w * 0.32, y + h * 0.35, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8F5B3C';
        ctx.fillRect(x + w * 0.22, y + h * 0.48, 26, 42);

        // Battle rope wave
        ctx.strokeStyle = '#F2C59B';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (let i = 0; i <= 30; i++) {
          const rx = x + w * 0.35 + (i / 30) * (w * 0.6);
          const ry = y + h * 0.62 + Math.sin(i * 0.45 - (isVideoMode ? time * 9 : 1.2)) * 12;
          if (i === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.stroke();
      } else if (style === 'mindset') {
        // Golden sunset horizon + silhouette
        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, '#26170C');
        g.addColorStop(0.55, '#B36A2E');
        g.addColorStop(0.8, '#F5B86E');
        g.addColorStop(1, '#1A110B');
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);

        // Sun glow
        ctx.fillStyle = '#FFE2A8';
        ctx.beginPath();
        ctx.arc(x + w * 0.68, y + h * 0.55 - pulse * 0.5, 16, 0, Math.PI * 2);
        ctx.fill();

        // Thinker silhouette
        ctx.fillStyle = '#120B07';
        ctx.beginPath();
        ctx.arc(x + w * 0.38, y + h * 0.44, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + w * 0.38, y + h * 0.95, 34, 30, 0, Math.PI, 0);
        ctx.fill();
      } else if (style === 'trading') {
        // Dark financial screen + trader silhouette
        ctx.fillStyle = '#0D1012';
        ctx.fillRect(x, y, w, h);

        // Glowing candlestick / chart lines in background
        ctx.strokeStyle = '#68A678';
        ctx.lineWidth = 2.5;
        for (let i = 0; i < 8; i++) {
          const bx = x + 18 + i * 16;
          const bh = 18 + ((i * 19) % 36) + (isVideoMode ? Math.sin(time * 5 + i) * 8 : 0);
          ctx.beginPath();
          ctx.moveTo(bx, y + h * 0.75);
          ctx.lineTo(bx, y + h * 0.75 - bh);
          ctx.stroke();
        }

        // Trader silhouette in center-right
        ctx.fillStyle = '#E0B084';
        ctx.beginPath();
        ctx.arc(x + w * 0.52, y + h * 0.34, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#191B1F';
        ctx.beginPath();
        ctx.ellipse(x + w * 0.52, y + h * 0.92, 34, 34, 0, Math.PI, 0);
        ctx.fill();
      }

      ctx.restore();
    }

    // ----------------------------------------------------------------------------
    // CARD 1: "HEARTLINE" Red Dark Creative Studio Hero Card
    // ----------------------------------------------------------------------------
    function renderHeartlineCard(ctx, time, isVideoMode) {
      const w = CARD_TEX_W;
      const h = CARD_TEX_H;

      // Deep pitch black background (#050505)
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, w, h);

      // Top Micro Navigation Bar
      ctx.save();
      ctx.font = '600 21px "Inter", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.fillText('SERVICES', 745, 76);
      ctx.fillText('WORK', 945, 76);
      ctx.fillText('ABOUT', 1095, 76);
      ctx.textAlign = 'right';
      ctx.fillText('START A PROJECT', w - 92, 76);
      ctx.restore();

    function renderRestrictedMarketCard(ctx, time, isVideoMode) {
      const w = CARD_TEX_W;

      // Deep dark forest charcoal (#070A08)
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, '#070A09');
      bg.addColorStop(0.65, '#09110D');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.textAlign = 'center';

      // Top Small Caps Eyebrow
      ctx.font = '600 22px "Inter", sans-serif';
      ctx.fillStyle = 'rgba(165, 195, 180, 0.65)';
      ctx.letterSpacing = '3px';
      ctx.fillText("WHY TARAN AGENCY DOESN'T WORK LIKE ANY OTHER", w / 2, 235);

      // Main 3-Line Condensed Uppercase Headline
      ctx.font = '700 124px "Oswald", "Impact", sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillStyle = '#F5F7F6';
      ctx.fillText('IN A RESTRICTED', w / 2, 365);
      ctx.fillText('MARKET, SEO IS', w / 2, 492);
      ctx.fillStyle = '#8FD6B4';
      ctx.fillText('LEVERAGED', w / 2, 620);

      // Subtitle
      ctx.font = '500 23px "Inter", sans-serif';
      ctx.fillStyle = 'rgba(180, 205, 192, 0.68)';
      ctx.letterSpacing = '1px';
      ctx.fillText('A PROPRIETARY GROWTH ENGINE ENGINEERED FOR HIGH-COMPETITION VERTICALS.', w / 2, 682);
      ctx.restore();

      // Bottom Equalizer Vertical Bar Graph (78 dense vertical bars across full width)
      ctx.save();
      const numBars = 78;
      const leftPad = 76;
      const usableW = w - leftPad * 2;
      const stepX = usableW / numBars;
      const baseBottom = h - 30;

      for (let i = 0; i < numBars; i++) {
        const t = i / (numBars - 1);
        // Shape matching reference video: dip on left-center, steep rise on right
        const envelope =
          0.22 +
          0.18 * Math.sin(t * Math.PI * 2.2 - 0.6) +
          0.58 * Math.pow(t, 1.65) +
          0.08 * Math.sin(i * 0.7);

        const animOffset = isVideoMode ? Math.sin(time * 5.0 + i * 0.25) * 0.06 : 0;
        const barH = Math.max(45, (envelope + animOffset) * 470);
        const bx = leftPad + i * stepX;
        const by = baseBottom - barH;

        // Vertical bar gradient (bright mint/white top tip, deep emerald body)
        const barGrad = ctx.createLinearGradient(bx, by, bx, baseBottom);
        barGrad.addColorStop(0, '#D8F8E8');
        barGrad.addColorStop(0.15, '#8FD6B4');
        barGrad.addColorStop(0.7, '#2F6E51');
        barGrad.addColorStop(1, 'rgba(20, 55, 38, 0.25)');

        ctx.fillStyle = barGrad;
        ctx.fillRect(bx, by, 6.5, barH);

        // Bright cap dot
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(bx, by, 6.5, 4);
      }

      // Embedded metric callouts inside the bars
      ctx.font = '700 22px "Inter", sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText('+240%', leftPad + usableW * 0.25, baseBottom - 95);
      ctx.fillText('+490%', leftPad + usableW * 0.56, baseBottom - 165);
      ctx.fillStyle = '#8FD6B4';
      ctx.fillText('+760% ROI', leftPad + usableW * 0.84, baseBottom - 260);
      ctx.restore();
    }

    // ============================================================================
    // 2. THREE.JS SCENE, COMPACT CAMERA & CURVED CYLINDER PATCH GEOMETRY
    // ============================================================================

    const container = document.getElementById('webgl-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Medium-telephoto PerspectiveCamera (27 deg FOV) placed further back (base Z = 15.6)
    // Prevents wide-angle foreshortening so the front card stays compact (~32% viewport width)
    const BASE_CAMERA_FOV = 27;
    const BASE_CAMERA_Z = 15.6;
    let userScale = 1.0;

    const camera = new THREE.PerspectiveCamera(
      BASE_CAMERA_FOV,
      window.innerWidth / window.innerHeight,
      0.1,
      120
    );

    // Dynamically adjust camera distance for narrower split-screen preview panels
    // so the entire 3D cylinder ring and 3-4 visible cards always fit with generous black margins
    function updateCameraResponsiveDistance() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // In the reference video (aspect ~2.18), Z = 15.6 makes the main card ~32% width.
      // If the preview panel is narrower (aspect < 1.95), smoothly pull camera back proportionally:
      const aspectCompensation = aspect < 1.95 ? Math.max(1.0, Math.pow(1.92 / aspect, 0.82)) : 1.0;
      camera.position.set(0, 0, (BASE_CAMERA_Z * aspectCompensation) / userScale);
    }

    updateCameraResponsiveDistance();

    // Create a curved cylindrical patch geometry so each card curves smoothly around the cylinder
    function createCurvedCardGeometry(radius, arcAngle, height, radialSegments = 64, heightSegments = 24) {
      const geom = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let y = 0; y <= heightSegments; y++) {
        const v = y / heightSegments;
        const py = (v - 0.5) * height;

        for (let x = 0; x <= radialSegments; x++) {
          const u = x / radialSegments;
          // Angle goes from -arcAngle/2 to +arcAngle/2 around the front (+Z) of the cylinder
          const theta = (u - 0.5) * arcAngle;
          const px = Math.sin(theta) * radius;
          const pz = Math.cos(theta) * radius;

          positions.push(px, py, pz);
          uvs.push(u, v);
        }
      }

      for (let y = 0; y < heightSegments; y++) {
        for (let x = 0; x < radialSegments; x++) {
          const a = x + (radialSegments + 1) * y;
          const b = x + (radialSegments + 1) * (y + 1);
          const c = (x + 1) + (radialSegments + 1) * (y + 1);
          const d = (x + 1) + (radialSegments + 1) * y;

          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    // Foreground Card Shader:
    // - Razor-sharp anti-aliased SDF rounded corners in UV space
    // - Subtle 3D cylindrical depth shading
    // - Smooth hover dimming multiplier (matches 00:01 & 00:04 in the reference video)
    const foregroundVertexShader = `
      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      void main() {
        vUv = uv;
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPosition.xyz;
        vWorldNormal = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `;

    const foregroundFragmentShader = `
      uniform sampler2D uTexture;
      uniform float uBrightness;
      uniform vec2 uAspect;
      uniform float uCornerRadius;

      varying vec2 vUv;
      varying vec3 vWorldPos;
      varying vec3 vWorldNormal;

      // Signed Distance Field for a 2D rounded box
      float sdRoundedBox(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      void main() {
        // Map UV (0..1) to aspect-corrected coordinates centered at (0,0)
        vec2 p = (vUv - 0.5) * uAspect;
        vec2 halfSize = uAspect * 0.5;
        float dist = sdRoundedBox(p, halfSize, uCornerRadius);

        // Smooth anti-aliased rounded corner alpha mask
        float alpha = 1.0 - smoothstep(-0.0035, 0.0035, dist);
        if (alpha < 0.01) discard;

        vec4 texColor = texture2D(uTexture, vUv);

        // Subtle depth attenuation for cards curving away on the sides
        float depthFade = smoothstep(-2.5, 5.8, vWorldPos.z);
        float lighting = mix(0.42, 1.0, depthFade);

        // Subtle inner border bevel highlight
        float borderLine = 1.0 - smoothstep(0.0, 0.008, abs(dist + 0.003));
        vec3 finalRgb = texColor.rgb * lighting * uBrightness;
        finalRgb += vec3(0.12) * borderLine * depthFade;

        gl_FragColor = vec4(finalRgb, alpha);
      }
    `;

    // Upper & Lower Chromatic-Aberrated Reflection Ring Shader:
    // - Multi-step directional RGB chromatic dispersion (cyan/blue/magenta/red/yellow prism fringes)
    // - Stacked ghost-edge trails matching the upper/lower rings at 00:00-00:06
    const backgroundFragmentShader = `
      uniform sampler2D uTexture;
      uniform float uChromaStrength;
      uniform vec2 uAspect;
      uniform float uCornerRadius;

      varying vec2 vUv;
      varying vec3 vWorldPos;

      float sdRoundedBox(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      void main() {
        // Vertically mirrored reflection UV
        vec2 uv = vec2(vUv.x, 1.0 - vUv.y);

        vec2 p = (uv - 0.5) * uAspect;
        vec2 halfSize = uAspect * 0.5;

        // Multi-step directional RGB chromatic dispersion & ghost-edge trails
        vec2 shiftR = vec2(0.026, -0.016) * uChromaStrength;
        vec2 shiftY = vec2(0.014, -0.008) * uChromaStrength;
        vec2 shiftG = vec2(0.000, 0.004) * uChromaStrength;
        vec2 shiftC = vec2(-0.015, 0.012) * uChromaStrength;
        vec2 shiftB = vec2(-0.028, 0.020) * uChromaStrength;

        float distR = sdRoundedBox(p + shiftR * uAspect, halfSize, uCornerRadius);
        float distG = sdRoundedBox(p + shiftG * uAspect, halfSize, uCornerRadius);
        float distB = sdRoundedBox(p + shiftB * uAspect, halfSize, uCornerRadius);

        float maskR = 1.0 - smoothstep(-0.018, 0.028, distR);
        float maskG = 1.0 - smoothstep(-0.018, 0.028, distG);
        float maskB = 1.0 - smoothstep(-0.018, 0.028, distB);

        float alpha = max(max(maskR, maskG), maskB);
        if (alpha < 0.01) discard;

        // 5-tap directional ghost trail blur per spectral band
        vec3 col = vec3(0.0);
        for (int i = -2; i <= 2; i++) {
          float fi = float(i) * 0.005 * uChromaStrength;
          vec2 trail = vec2(fi, -fi * 0.65);

          float r = texture2D(uTexture, clamp(uv + shiftR + trail, 0.002, 0.998)).r * maskR;
          float y = texture2D(uTexture, clamp(uv + shiftY + trail, 0.002, 0.998)).r * maskR;
          float g = texture2D(uTexture, clamp(uv + shiftG + trail, 0.002, 0.998)).g * maskG;
          float c = texture2D(uTexture, clamp(uv + shiftC + trail, 0.002, 0.998)).b * maskB;
          float b = texture2D(uTexture, clamp(uv + shiftB + trail, 0.002, 0.998)).b * maskB;

          col.r += (r * 0.72 + y * 0.28) * 0.2;
          col.g += (g * 0.65 + y * 0.20 + c * 0.15) * 0.2;
          col.b += (b * 0.75 + c * 0.25) * 0.2;
        }

        // Stacked prism rainbow edge fringes (cyan/blue/magenta/red/yellow) around card borders
        float fringeR = (1.0 - smoothstep(0.0, 0.036, abs(distR))) * 0.62;
        float fringeG = (1.0 - smoothstep(0.0, 0.036, abs(distG))) * 0.48;
        float fringeB = (1.0 - smoothstep(0.0, 0.036, abs(distB))) * 0.72;
        col += vec3(fringeR, fringeG, fringeB) * uChromaStrength;

        // Depth attenuation & smooth vertical fade into pure #000000
        float zFade = smoothstep(-5.2, 5.4, vWorldPos.z);
        float yVignette = smoothstep(4.2, 1.35, abs(vWorldPos.y));
        float brightness = 0.62 * zFade * yVignette;

        gl_FragColor = vec4(col * brightness, alpha * 0.9);
      }
    `;

    // ============================================================================
    // 3. BUILD THE 8-CARD CYLINDER ASSEMBLY (R = 5.15, H = 1.98, 37° ARC, 8° GAP)
    // ============================================================================

    // Ordered around the 8-slot cylinder so left-to-right rotation matches 00:00 -> 00:06.5:
    // Slot 0: White Categories Card (center-left at 00:00)
    // Slot 1: HEARTLINE Card (enters from left at 00:00 -> center at 00:04-00:06)
    // Slot 2: CBD SEO Card (enters from left at 00:03 -> left-center at 00:05-00:06)
    // Slot 3: Warm Beauty Portrait Card
    // Slot 4: MASTER 440+ / GROWTH STRATEGY Card
    // Slot 5: Architectural Luxury Card
    // Slot 6: "No sigas líderes" Monochrome Card (far right at 00:00)
    // Slot 7: "IN A RESTRICTED MARKET, SEO IS LEVERAGED" Card (center-right at 00:00)
    const cardRenderers = [
      { id: 'categories', name: 'Entrepreneurship / Categories', draw: renderCategoriesCard },
      { id: 'heartline', name: 'HEARTLINE Creative Studio', draw: renderHeartlineCard },
      { id: 'cbd_seo', name: 'CBD SEO Growth Strategy', draw: renderCbdSeoCard },
      { id: 'beauty', name: 'Botanical Radiance Portrait', draw: renderBeautyCard },
      { id: 'master', name: 'MASTER 440+ Growth Strategy', draw: renderMasterBlueCard },
      { id: 'arch_luxury', name: 'Aura Atelier Architecture', draw: renderArchitecturalLuxuryCard },
      { id: 'no_sigas', name: 'No sigas líderes', draw: renderNoSigasLideresCard },
      { id: 'restricted', name: 'In A Restricted Market SEO', draw: renderRestrictedMarketCard }
    ];

    const NUM_CARDS = 8; // 8 cards around 360° ring (45° per slot = 37° card arc + 8° dark gap)
    const ANGLE_STEP = (Math.PI * 2) / NUM_CARDS; // 45 degrees in radians

    // Create high-DPI offscreen canvases and Three.js CanvasTextures for all 8 cards
    const cardStates = cardRenderers.map((item) => {
      const canvas = document.createElement('canvas');
      canvas.width = CARD_TEX_W;
      canvas.height = CARD_TEX_H;
      const ctx = canvas.getContext('2d');

      item.draw(ctx, 0, false);

      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

      return {
        ...item,
        canvas,
        ctx,
        texture,
        currentBrightness: 1.0,
        targetBrightness: 1.0
      };
    });

    // Unified Cylinder Tilt Assembly:
    // Tilted at -10.8 degrees (rotation.z) with slight 2.2 degree pitch (rotation.x)
    const cylinderAssembly = new THREE.Group();
    cylinderAssembly.rotation.z = THREE.MathUtils.degToRad(-10.8);
    cylinderAssembly.rotation.x = THREE.MathUtils.degToRad(2.2);
    cylinderAssembly.position.set(0, -0.06, 0);
    scene.add(cylinderAssembly);

    // Center Sharp Foreground Ring
    const foregroundRing = new THREE.Group();
    cylinderAssembly.add(foregroundRing);

    const CYLINDER_RADIUS = 5.15;
    const CARD_ARC_RAD = THREE.MathUtils.degToRad(37); // 37° card arc (with 8° gap between cards)
    const CARD_HEIGHT = 1.98; // Sleek 1.68:1 aspect ratio
    const cardGeometry = createCurvedCardGeometry(CYLINDER_RADIUS, CARD_ARC_RAD, CARD_HEIGHT, 64, 24);

    const foregroundMeshes = [];

    cardStates.forEach((state, index) => {
      const material = new THREE.ShaderMaterial({
        vertexShader: foregroundVertexShader,
        fragmentShader: foregroundFragmentShader,
        uniforms: {
          uTexture: { value: state.texture },
          uBrightness: { value: 1.0 },
          uAspect: { value: new THREE.Vector2(1.68, 1.0) },
          uCornerRadius: { value: 0.082 }
        },
        transparent: true,
        side: THREE.DoubleSide
      });

      const mesh = new THREE.Mesh(cardGeometry, material);
      mesh.rotation.y = -index * ANGLE_STEP;
      mesh.userData = { cardIndex: index, state, material };

      foregroundRing.add(mesh);
      foregroundMeshes.push(mesh);
    });

    // Upper & Lower Chromatic-Aberrated Reflection Rings positioned along local Y-axis at y = +2.52 and y = -2.52
    const bgUpperRing = new THREE.Group();
    bgUpperRing.position.set(0, 2.52, 0);
    cylinderAssembly.add(bgUpperRing);

    const bgLowerRing = new THREE.Group();
    bgLowerRing.position.set(0, -2.52, 0);
    cylinderAssembly.add(bgLowerRing);

    const bgMaterials = [];

    // Upper Reflected Ring (shows mirrored cards with RGB chromatic dispersion above the main ring)
    const upperOrder = [3, 4, 1, 2, 0, 7, 6, 5];
    upperOrder.forEach((cardIdx, slotIdx) => {
      const mat = new THREE.ShaderMaterial({
        vertexShader: foregroundVertexShader,
        fragmentShader: backgroundFragmentShader,
        uniforms: {
          uTexture: { value: cardStates[cardIdx].texture },
          uChromaStrength: { value: 1.0 },
          uAspect: { value: new THREE.Vector2(1.68, 1.0) },
          uCornerRadius: { value: 0.082 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      bgMaterials.push(mat);

      const mesh = new THREE.Mesh(cardGeometry, mat);
      mesh.rotation.y = -slotIdx * ANGLE_STEP + 0.12;
      bgUpperRing.add(mesh);
    });

    // Lower Reflected Ring (shows mirrored MASTER 440+ & RESTRICTED MARKET cards below the main ring)
    const lowerOrder = [4, 7, 2, 1, 0, 6, 5, 3];
    lowerOrder.forEach((cardIdx, slotIdx) => {
      const mat = new THREE.ShaderMaterial({
        vertexShader: foregroundVertexShader,
        fragmentShader: backgroundFragmentShader,
        uniforms: {
          uTexture: { value: cardStates[cardIdx].texture },
          uChromaStrength: { value: 1.05 },
          uAspect: { value: new THREE.Vector2(1.68, 1.0) },
          uCornerRadius: { value: 0.082 }
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      bgMaterials.push(mat);

      const mesh = new THREE.Mesh(cardGeometry, mat);
      mesh.rotation.y = -slotIdx * ANGLE_STEP - 0.14;
      bgLowerRing.add(mesh);
    });

    // ============================================================================
    // 4. INTERACTION, RAYCAST HOVER DIMMING, AUTO-ORBIT & COMPACT UI CONTROLS
    // ============================================================================

    // Exact starting angle at t = 00:00 of the reference video:
    // White Categories Card is at center-left (-0.21 rad), IN A RESTRICTED MARKET is at center-right,
    // HEARTLINE edge is peeking in on the far left, and "No sigas líderes" is on the far right.
    const INITIAL_RING_ROTATION = -0.21;
    // Speed calibrated so 6.5 seconds of auto-rotation matches 00:00 -> 00:06.5 in the reference video
    const VIDEO_ANGULAR_SPEED = 0.172; // radians per second

    let currentRotation = INITIAL_RING_ROTATION;
    let targetRotation = INITIAL_RING_ROTATION;
    let speedMultiplier = 1.0;
    let isVideoMode = false;

    // Pointer / Drag / Raycaster state
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2(-10, -10);
    let isDragging = false;
    let dragStartX = 0;
    let dragStartRotation = 0;
    let lastInteractionTime = -10;
    let hoveredCardState = null;

    container.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartRotation = targetRotation;
      container.classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
      // Update normalized device coordinates for raycast hover dimming
      pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

      if (isDragging) {
        const deltaX = e.clientX - dragStartX;
        targetRotation = dragStartRotation + deltaX * 0.0038;
        lastInteractionTime = performance.now() * 0.001;
      }
    });

    window.addEventListener('pointerup', () => {
      if (isDragging) {
        isDragging = false;
        container.classList.remove('dragging');
      }
    });

    // Smooth wheel / trackpad scrolling
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      targetRotation += delta * 0.0014;
      lastInteractionTime = performance.now() * 0.001;
    }, { passive: false });

    // Clicking a card without dragging centers it smoothly
    container.addEventListener('click', (e) => {
      if (Math.abs(e.clientX - dragStartX) > 6) return;
      if (hoveredCardState) {
        const idx = cardStates.indexOf(hoveredCardState);
        if (idx !== -1) {
          // Find nearest equivalent angle to center that card
          const desiredBase = idx * ANGLE_STEP;
          const twoPi = Math.PI * 2;
          const diff = ((desiredBase - targetRotation + Math.PI) % twoPi + twoPi) % twoPi - Math.PI;
          targetRotation += diff;
          lastInteractionTime = performance.now() * 0.001;
        }
      }
    });

    // PHOTO | VIDEO Toggle Pill Controls
    const modeToggle = document.getElementById('mode-toggle');
    const btnPhoto = document.getElementById('btn-photo');
    const btnVideo = document.getElementById('btn-video');

    function setDisplayMode(mode) {
      isVideoMode = mode === 'video';
      modeToggle.setAttribute('data-mode', mode);
      if (isVideoMode) {
        btnVideo.classList.add('active');
        btnVideo.classList.remove('inactive');
        btnPhoto.classList.add('inactive');
        btnPhoto.classList.remove('active');
      } else {
        btnPhoto.classList.add('active');
        btnPhoto.classList.remove('inactive');
        btnVideo.classList.add('inactive');
        btnVideo.classList.remove('active');
        // Re-render crisp static frame once
        cardStates.forEach((st) => {
          st.draw(st.ctx, 0, false);
          st.texture.needsUpdate = true;
        });
      }
    }

    btnPhoto.addEventListener('click', () => setDisplayMode('photo'));
    btnVideo.addEventListener('click', () => setDisplayMode('video'));

    // Settings Tuner Panel Controls
    const settingsTrigger = document.getElementById('settings-trigger');
    const tunerPanel = document.getElementById('tuner-panel');
    const resetSceneBtn = document.getElementById('reset-scene-btn');
    const sliderScale = document.getElementById('slider-scale');
    const sliderSpeed = document.getElementById('slider-speed');
    const sliderTilt = document.getElementById('slider-tilt');
    const sliderChroma = document.getElementById('slider-chroma');
    const valScale = document.getElementById('val-scale');
    const valSpeed = document.getElementById('val-speed');
    const valTilt = document.getElementById('val-tilt');
    const valChroma = document.getElementById('val-chroma');

    settingsTrigger.addEventListener('click', () => {
      tunerPanel.classList.toggle('open');
    });

    resetSceneBtn.addEventListener('click', () => {
      targetRotation = INITIAL_RING_ROTATION;
      currentRotation = INITIAL_RING_ROTATION;
      userScale = 1.0;
      sliderScale.value = '1.00';
      valScale.textContent = '100%';
      updateCameraResponsiveDistance();

      sliderSpeed.value = '1.0';
      speedMultiplier = 1.0;
      valSpeed.textContent = '1.0x';

      sliderTilt.value = '-10.8';
      cylinderAssembly.rotation.z = THREE.MathUtils.degToRad(-10.8);
      valTilt.textContent = '-10.8°';

      sliderChroma.value = '1.0';
      valChroma.textContent = '100%';
      bgMaterials.forEach((m) => (m.uniforms.uChromaStrength.value = 1.0));
    });

    document.querySelectorAll('.ts-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const sec = parseFloat(btn.getAttribute('data-time'));
        targetRotation = INITIAL_RING_ROTATION + sec * VIDEO_ANGULAR_SPEED;
        lastInteractionTime = performance.now() * 0.001;
      });
    });

    sliderScale.addEventListener('input', (e) => {
      userScale = parseFloat(e.target.value);
      valScale.textContent = Math.round(userScale * 100) + '%';
      updateCameraResponsiveDistance();
    });

    sliderSpeed.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      valSpeed.textContent = speedMultiplier.toFixed(1) + 'x';
    });

    sliderTilt.addEventListener('input', (e) => {
      const deg = parseFloat(e.target.value);
      cylinderAssembly.rotation.z = THREE.MathUtils.degToRad(deg);
      valTilt.textContent = deg.toFixed(1) + '°';
    });

    sliderChroma.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      valChroma.textContent = Math.round(val * 100) + '%';
      bgMaterials.forEach((m) => (m.uniforms.uChromaStrength.value = val));
    });

    // Responsive Window Resize
    window.addEventListener('resize', () => {
      updateCameraResponsiveDistance();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================================
    // 5. MAIN ANIMATION LOOP
    // ============================================================================

    const scrollThumb = document.getElementById('scroll-thumb');
    let lastFrameTime = performance.now() * 0.001;

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now() * 0.001;
      const dt = Math.min(0.05, now - lastFrameTime);
      lastFrameTime = now;

      // Continuous auto-rotation from left to right (matches video flow)
      if (!isDragging && (now - lastInteractionTime > 1.2)) {
        targetRotation += VIDEO_ANGULAR_SPEED * speedMultiplier * dt;
      }

      // Smooth inertial damping
      currentRotation += (targetRotation - currentRotation) * 0.095;

      // Apply rotation to foreground ring and synchronized upper/lower chromatic reflection rings
      foregroundRing.rotation.y = currentRotation;
      bgUpperRing.rotation.y = currentRotation * 0.92;
      bgLowerRing.rotation.y = currentRotation * 0.94;

      // Update custom right-edge scrollbar thumb position
      const normalizedProgress = ((currentRotation - INITIAL_RING_ROTATION) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2);
      const maxThumbTop = Math.max(20, window.innerHeight - 64);
      scrollThumb.style.top = (4 + normalizedProgress * maxThumbTop * 0.25) + 'px';

      // Raycast hover detection on foreground 3D cards:
      // Exact match to reference video at 00:01 & 00:04 where hovered card dims to ~0.72 brightness
      raycaster.setFromCamera(pointerNDC, camera);
      const intersects = raycaster.intersectObjects(foregroundMeshes, false);

      hoveredCardState = null;
      if (intersects.length > 0 && !isDragging) {
        const hitMesh = intersects[0].object;
        hoveredCardState = hitMesh.userData.state;
        container.classList.add('hovering-card');
      } else {
        container.classList.remove('hovering-card');
      }

      cardStates.forEach((st, idx) => {
        st.targetBrightness = (hoveredCardState === st) ? 0.72 : 1.0;
        st.currentBrightness += (st.targetBrightness - st.currentBrightness) * 0.14;
        foregroundMeshes[idx].userData.material.uniforms.uBrightness.value = st.currentBrightness;

        // If VIDEO mode is active, dynamically animate all card canvas textures in real time
        if (isVideoMode) {
          st.draw(st.ctx, now, true);
          st.texture.needsUpdate = true;
        }
      });

      renderer.render(scene, camera);
    }

    window.onload = function () {
      // Re-render card textures once web fonts finish loading so typography is 100% accurate
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          cardStates.forEach((st) => {
            st.draw(st.ctx, 0, isVideoMode);
            st.texture.needsUpdate = true;
          });
        });
      }
      animate();
    };
  </script>
</body>
</html>
